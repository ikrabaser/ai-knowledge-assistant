<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masteacon — Trusted answers from your knowledge</title>

    <meta
      name="description"
      content="Masteacon brings your knowledge together so teams can find relevant information, ask naturally, and get clear answers with visible supporting sources."
    />

    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#071521" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Masteacon" />
    <meta
      property="og:title"
      content="Masteacon — Trusted answers from your knowledge"
    />
    <meta
      property="og:description"
      content="Bring your knowledge together, find what matters, and get clear answers with visible supporting evidence."
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Masteacon — Trusted answers from your knowledge"
    />
    <meta
      name="twitter:description"
      content="Bring your knowledge together, find what matters, and get clear answers with visible supporting evidence."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/masteacon-favicon.svg" />
    <script>
      (function () {
        try {
          var mode =
            localStorage.getItem("masteacon_theme_mode") ||
            localStorage.getItem("aika_theme_mode") ||
            "dark";

          if (!localStorage.getItem("masteacon_theme_mode")) {
            localStorage.setItem("masteacon_theme_mode", mode);
            localStorage.removeItem("aika_theme_mode");
          }
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
